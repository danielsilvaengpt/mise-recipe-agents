<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FBF6EC" />
  
  <!-- Subtle background grid pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D9CDB4" opacity="0.6" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Center Ticket Card -->
  <g transform="translate(180, 75)">
    <!-- Shadow -->
    <rect x="0" y="8" width="840" height="480" rx="16" fill="#1E1B16" opacity="0.08" />
    <!-- Ticket Body -->
    <rect x="0" y="0" width="840" height="480" rx="16" fill="#F3EAD8" stroke="#D9CDB4" stroke-width="2" />

    <!-- Brand Header -->
    <circle cx="50" cy="55" r="12" fill="#D8432B" />
    <text x="75" y="63" font-family="'Fraunces', serif" font-weight="800" font-size="28" fill="#1E1B16">AgentesCozinha</text>
    <text x="780" y="60" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#5C5547" text-anchor="end">RECEITA Nº 014 · IA PIPELINE</text>

    <!-- Perforation line -->
    <line x1="40" y1="95" x2="800" y2="95" stroke="#D9CDB4" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Main Headline -->
    <text x="50" y="170" font-family="'Fraunces', serif" font-weight="800" font-size="44" fill="#1E1B16">Abre a despensa. Nós inventamos o jantar.</text>
    <text x="50" y="215" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#5C5547">Três agentes de IA criam receitas com o que tens em casa e dizem o que falta.</text>

    <!-- Stamp 1: DISPONÍVEL -->
    <g transform="translate(50, 275) rotate(-3)">
      <rect x="0" y="0" width="180" height="48" rx="4" fill="#4F5D2F" fill-opacity="0.12" stroke="#4F5D2F" stroke-width="2" />
      <text x="90" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#4F5D2F" text-anchor="middle" letter-spacing="2">✓ DISPONÍVEL</text>
    </g>

    <!-- Stamp 2: EM FALTA -->
    <g transform="translate(260, 275) rotate(2)">
      <rect x="0" y="0" width="170" height="48" rx="4" fill="#E9A83B" fill-opacity="0.15" stroke="#E9A83B" stroke-width="2" />
      <text x="85" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#C47D15" text-anchor="middle" letter-spacing="2">! EM FALTA</text>
    </g>

    <!-- Bottom info -->
    <line x1="40" y1="385" x2="800" y2="385" stroke="#D9CDB4" stroke-width="2" stroke-dasharray="8 8" />
    <text x="50" y="430" font-family="'JetBrains Mono', monospace" font-size="15" fill="#5C5547">Chef criativo → Redator de receitas → Revisor</text>
    <text x="780" y="430" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#D8432B" text-anchor="end">100% Português de Portugal</text>
  </g>
</svg>
